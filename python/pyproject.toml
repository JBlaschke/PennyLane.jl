[project]
name = "pennylane-jl-python"
version = "0.0.1"
description = "Pinned Python environment used by PennyLane.jl (PennyLane as test oracle, Catalyst compiler + Lightning runtime as binaries)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pennylane==0.45.1",
    "pennylane-catalyst==0.15.0",
    "pennylane-lightning>=0.45,<0.46",
]

[tool.uv]
package = false
